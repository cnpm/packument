name: Benchmark
permissions:
  contents: read
  pull-requests: write
env:
  DEBUG: napi:*
  APP_NAME: packument
  CARGO_INCREMENTAL: '1'
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: x86_64-unknown-linux-gnu-cargo-ubuntu-latest-benchmark-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
      - name: Run benchmarks and create comment
        run: |
          echo "Running benchmarks..."
          yarn bench 2>&1 | tee benchmark-output.txt

          echo "## ⚡ Benchmark Results" >> comment.md
          echo "" >> comment.md
          echo "<details>" >> comment.md
          echo "<summary>Click to expand benchmark output</summary>" >> comment.md
          echo "" >> comment.md
          echo '```' >> comment.md
          cat benchmark-output.txt >> comment.md
          echo '```' >> comment.md
          echo "" >> comment.md
          echo "</details>" >> comment.md
          echo "" >> comment.md
          echo "_Benchmark ran on x86_64-unknown-linux-gnu target_" >> comment.md
          cat comment.md >> $GITHUB_STEP_SUMMARY
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '⚡ Benchmark Results'
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md
          edit-mode: replace
