name: Benchmark
permissions:
  contents: read
  pull-requests: write
env:
  DEBUG: napi:*
  APP_NAME: packument
  CARGO_INCREMENTAL: '1'
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Setup node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 24
          cache: yarn
      - name: Install Rust
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561 # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: x86_64-unknown-linux-gnu-cargo-ubuntu-latest-benchmark-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: yarn install
      - name: Build
        run: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
      - name: Run benchmarks and create comment
        run: |
          echo "Running benchmarks..."
          yarn bench 2>&1 | tee benchmark-output.txt

          echo "## ⚡ Benchmark Results" >> comment.md
          echo "" >> comment.md
          echo "<details>" >> comment.md
          echo "<summary>Click to expand benchmark output</summary>" >> comment.md
          echo "" >> comment.md
          echo '```' >> comment.md
          cat benchmark-output.txt >> comment.md
          echo '```' >> comment.md
          echo "" >> comment.md
          echo "</details>" >> comment.md
          echo "" >> comment.md
          echo "_Benchmark ran on x86_64-unknown-linux-gnu target_" >> comment.md
          cat comment.md >> $GITHUB_STEP_SUMMARY
      - name: Find existing comment
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '⚡ Benchmark Results'
      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md
          edit-mode: replace
